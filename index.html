<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Internal Audit Register Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{--bg:#eef1f8;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e5e9f2;--soft:#f6f8fc;--pri:#4f46e5;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#121a2e;--tx:#e8edf8;--mut:#94a3c0;--bd:#223052;--soft:#0f172b;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#121a2e;--tx:#e8edf8;--mut:#94a3c0;--bd:#223052;--soft:#0f172b;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx)}
.hero{background:linear-gradient(120deg,#0b1b3f,#1e3a8a 55%,#4338ca);color:#fff;padding:22px 28px 70px}
.wrap{max-width:1240px;margin:0 auto}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;gap:12px;align-items:center}
.mark{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:21px}
.logo h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}.logo p{margin:2px 0 0;font-size:12px;opacity:.7}
.seg{display:flex;background:rgba(255,255,255,.12);padding:3px;border-radius:10px}
.seg button{border:0;background:none;color:#cfd8ff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
.seg button.on{background:#fff;color:#1e1b4b}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.h{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.btn.d{background:#dc2626;border-color:#dc2626;color:#fff}.btn.v{background:#7c3aed;border-color:#7c3aed;color:#fff}
.main{max-width:1240px;margin:-48px auto 40px;padding:0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.k{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);border-top:4px solid var(--c)}
.k small{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px}.k b{display:block;font-size:30px;font-weight:800;margin-top:2px;color:var(--c)}
.alert{display:none;align-items:center;gap:12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:12px 16px;margin-bottom:16px;justify-content:space-between}
@media (prefers-color-scheme:dark){.alert{background:#3b1217;border-color:#7f1d1d;color:#fecaca}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--bd)}
.bar{display:flex;gap:10px;padding:14px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.bar input,.bar select,.in{background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;width:100%}
.bar input{flex:1;min-width:200px;width:auto}.bar select{width:auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:12px 16px;background:var(--soft);white-space:nowrap}
td{padding:14px 16px;border-top:1px solid var(--bd);vertical-align:top}
tr.r{cursor:pointer;transition:.15s}tr.r:hover{background:var(--soft)}
.t{font-weight:700}.id{font-size:11px;color:var(--mut);font-family:ui-monospace,monospace}
.cl{max-width:340px;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.s-Open{background:#fef3c7;color:#92400e}.s-In-Progress{background:#dbeafe;color:#1d4ed8}.s-Extended{background:#ede9fe;color:#6d28d9}.s-Overdue{background:#fee2e2;color:#b91c1c}.s-Closed{background:#d1fae5;color:#047857}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.ov{position:fixed;inset:0;background:rgba(8,13,30,.55);backdrop-filter:blur(3px);display:none;z-index:30}
.ov.show{display:grid;place-items:center;padding:16px}
.dr{position:relative;width:min(840px,100%);max-height:90vh;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);background:var(--card);display:flex;flex-direction:column}
.dh{background:linear-gradient(120deg,#0b1b3f,#3730a3);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:12px}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--bd)}
.tabs button{border:0;background:none;padding:12px 12px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.db{flex:1;min-height:0;overflow:auto;padding:20px 22px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.f{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.f small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;font-weight:600}
h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.box{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.adm{background:#faf5ff;border:1px solid #e9d5ff;border-radius:14px;padding:14px;margin-top:14px}
.adm.od{background:#fef2f2;border-color:#fecaca}
@media (prefers-color-scheme:dark){.adm{background:#241338;border-color:#4c1d95}.adm.od{background:#3b1217;border-color:#7f1d1d}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:20px}
.tl>div{position:relative;margin-bottom:18px}.tl>div:before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:4px;background:var(--pri)}
.att{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-top:8px}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:16px;text-align:center;background:var(--soft)}
.md{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(8,13,30,.55);padding:16px}.md.show{display:grid}
.md>div{background:var(--card);border-radius:16px;padding:22px;width:min(520px,100%);max-height:92vh;overflow:auto}
#toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:90;box-shadow:var(--sh)}
@media(max-width:700px){.hero{padding:18px 16px 70px}.main{padding:0 12px}}
#lgn{position:fixed;inset:0;z-index:60;background:linear-gradient(120deg,#0b1b3f,#1e3a8a 55%,#4338ca);display:grid;place-items:center;padding:16px;overflow:auto}
.lc{background:var(--card);border-radius:20px;padding:30px;width:min(420px,100%);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.msb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;font-weight:600}
.msb i{display:grid;grid-template-columns:repeat(2,9px);gap:2px}.msb i b{width:9px;height:9px;display:block}
.chip{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 12px;font-size:12px;line-height:1.35}
#cfgM{z-index:70}
