<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>PHB Audit Portal</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f4f6f9;
}

.header{
    background:#003366;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
}

.sidebar{
    position:fixed;
    left:0;
    top:60px;
    width:250px;
    height:100%;
    background:white;
    box-shadow:2px 0 10px rgba(0,0,0,0.1);
}

.sidebar ul{
    list-style:none;
    padding:0;
}

.sidebar li{
    padding:15px 20px;
    cursor:pointer;
}

.sidebar li:hover{
    background:#eef3f8;
}

.content{
    margin-left:270px;
    padding:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
    margin:0;
    color:#003366;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

th{
    background:#003366;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.status-open{
    color:red;
    font-weight:bold;
}

.status-progress{
    color:orange;
    font-weight:bold;
}

.status-closed{
    color:green;
    font-weight:bold;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="header">

<div>
PHB Audit Portal
</div>

<div id="userInfo">
Loading...
</div>

</div>

<div class="sidebar">

<ul>

<li onclick="loadDashboard()">Dashboard</li>

<li onclick="loadFindings()">Findings</li>

<li onclick="loadActionPlans()">Action Plans</li>

<li onclick="loadAuditTrail()">Audit Trail</li>

<li onclick="loadReports()">Reports</li>

<li id="adminMenu" class="hidden"
onclick="loadAdmin()">
Administration
</li>

</ul>

</div>

<div class="content">

<div id="dashboardSection">

<div class="cards">

<div class="card">
<h4>Total Findings</h4>
<h2 id="totalFinding">0</h2>
</div>

<div class="card">
<h4>Overdue</h4>
<h2 id="overdueFinding">0</h2>
</div>

<div class="card">
<h4>Pending Review</h4>
<h2 id="pendingReview">0</h2>
</div>

<div class="card">
<h4>Closed</h4>
<h2 id="closedFinding">0</h2>
</div>

</div>

</div>

<div id="findingSection">

<h2>Audit Findings</h2>

<table>

<thead>

<tr>
<th>ID</th>
<th>Subject</th>
<th>Department</th>
<th>Status</th>
<th>Due Date</th>
<th>Assigned To</th>
</tr>

</thead>

<tbody id="findingTable"></tbody>

</table>

</div>

</div>

<script>

let currentUser=null;

const LOAD_USER_URL =
"YOUR_LOADUSER_FLOW_URL";

const LOAD_FINDINGS_URL =
"YOUR_LOADFINDINGS_FLOW_URL";

window.onload=async()=>{

 await getCurrentUser();

 await loadFindings();

};

async function getCurrentUser(){

 try{

 const response=await fetch(
 LOAD_USER_URL,
 {
 method:'POST'
 });

 const user=await response.json();

 currentUser=user;

 document.getElementById("userInfo").innerHTML=
 `${user.name} (${user.role})`;

 if(user.role==="audit_admin"){
     document
     .getElementById("adminMenu")
     .classList.remove("hidden");
 }

 }
 catch(error){

 console.log(error);

 }

}

async function loadFindings(){

 try{

 const response=await fetch(
 LOAD_FINDINGS_URL,
 {
 method:'POST'
 });

 const results=await response.json();

 populateDashboard(results);

 populateTable(results);

 }
 catch(error){

 console.log(error);

 }

}

function populateDashboard(data){

 document.getElementById("totalFinding")
 .innerText=data.length;

 let overdue=0;
 let pending=0;
 let closed=0;

 data.forEach(x=>{

 if(x.Status==="Pending Review")
     pending++;

 if(x.Status==="Closed")
     closed++;

 if(new Date(x.DueDate)
 < new Date()
 && x.Status!=="Closed")
     overdue++;

 });

 document.getElementById("overdueFinding")
 .innerText=overdue;

 document.getElementById("pendingReview")
 .innerText=pending;

 document.getElementById("closedFinding")
 .innerText=closed;

}

function populateTable(data){

 const tbody=
 document.getElementById("findingTable");

 tbody.innerHTML="";

 data.forEach(item=>{

 let statusClass="";

 if(item.Status==="Open")
     statusClass="status-open";

 if(item.Status==="In Progress")
     statusClass="status-progress";

 if(item.Status==="Closed")
     statusClass="status-closed";

 tbody.innerHTML+=`

 <tr>

 <td>${item.FindingID}</td>

 <td>${item.Subject}</td>

 <td>${item.Department}</td>

 <td class="${statusClass}">
 ${item.Status}
 </td>

 <td>${item.DueDate}</td>

 <td>${item.AssignedTo}</td>

 </tr>

 `;

 });

}

function loadDashboard(){

 alert("Dashboard");

}

function loadActionPlans(){

 alert("Action Plans");

}

function loadAuditTrail(){

 alert("Audit Trail");

}

function loadReports(){

 alert("Reports");

}

function loadAdmin(){

 alert("Administration");

}

</script>

</body>
</html>
